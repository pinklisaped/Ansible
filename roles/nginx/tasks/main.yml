---
# tasks file for roles/nginx
- name: Import OS specific tasks
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] | lower }}.yml"
  tags:
    - install_packages

- name: Absent defaults
  ansible.builtin.file:
    state: absent
    path: "{{ item }}"
  loop:
    - /etc/nginx/sites-enabled
    - /etc/nginx/sites-available
    - /etc/nginx/snippets

- name: Copy defaults
  ansible.builtin.copy:
    src: default.conf
    dest: /etc/nginx/conf.d/default.conf
    owner: nginx
    group: nginx
    mode: "0644"
  notify: Nginx reload

- name: Load dynamic nginx modules
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    line: "load_module modules/ngx_http_{{ item }}_module.so;"
    insertbefore: BOF
    state: present
  loop: "{{ nginx_modules }}"
  notify: Nginx reload

- name: Update limits
  ansible.builtin.template:
    src: templates/limits.conf.j2
    dest: "/etc/nginx/conf.d/limits_{{ item.key }}.conf"
    owner: nginx
    group: nginx
    mode: "0644"
  loop: "{{ nginx_rate_limits_zones | dict2items }}"
  notify: Nginx reload

- name: Read /etc/resolv.conf
  ansible.builtin.slurp:
    src: /etc/resolv.conf
  register: resolv_conf

- name: Extract first nameserver
  set_fact:
    nginx_le_resolver: >-
      {{
        (resolv_conf.content | b64decode)
        | regex_search('^nameserver\s+(\S+)', multiline=true)
        | regex_replace('^nameserver\s+', '')
      }}

- name: Create certs dir
  ansible.builtin.file:
    state: directory
    path: /etc/nginx/ssl
    mode: "0700"
    owner: nginx
    group: nginx

- name: Configure Letsencrypt acme
  ansible.builtin.copy:
    content: |
      resolver {{ nginx_le_resolver }};
      acme_shared_zone zone=ngx_acme_shared:1M;
      acme_issuer letsencrypt {
          uri         https://acme-v02.api.letsencrypt.org/directory;
          state_path  /etc/nginx/ssl;
          accept_terms_of_service;
      }
    dest: /etc/nginx/conf.d/le_acme.conf
    owner: nginx
    group: nginx
    mode: "0644"
  when: nginx_acme_enable
  notify: Nginx reload

- name: Nginx enable
  ansible.builtin.systemd_service:
    name: nginx
    state: "{{ nginx_service_state }}"
    enabled: "{{ nginx_service_enable | bool }}"

- name: Nginx UFW configuration
  ansible.builtin.import_tasks: ufw.yml
  when: ansible_facts['distribution'] | lower == 'ubuntu'
  tags:
    - firewall
